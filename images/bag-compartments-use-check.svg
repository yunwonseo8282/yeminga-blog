<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
<title id="title">칸 수보다 내 사용 조건을 확인하는 가상 가방 비교</title>
<desc id="desc">기존 가방과 파우치는 열쇠를 꺼낸 한 장면을 확인했어요. 새 가방은 수납칸 다섯 개만 확인했고 열쇠 접근과 노트북을 넣고 닫는지는 미확인이에요.</desc>
<rect width="600" height="400" rx="28" fill="#f7f2fa"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#302741">
<text x="32" y="48" font-size="26" font-weight="700">새 가방, 내 불편도 해결될까요?</text>
<text x="32" y="79" font-size="17" fill="#6b5b80">직접 만든 가상 사례 · 실제 상품 평가가 아니에요</text>
<rect x="24" y="102" width="267" height="237" rx="20" fill="#fff" stroke="#a593ce" stroke-width="2"/>
<rect x="309" y="102" width="267" height="237" rx="20" fill="#fff" stroke="#b8b0c5" stroke-width="2"/>
<text x="44" y="143" font-size="23" font-weight="700">기존 가방 + 파우치</text>
<text x="329" y="143" font-size="23" font-weight="700">새 가방 후보</text>
<rect x="44" y="167" width="227" height="43" rx="12" fill="#eee8fa"/>
<text x="57" y="195" font-size="21" font-weight="700">열쇠 꺼내기 확인</text>
<text x="44" y="247" font-size="20">한 장면의 결과예요</text>
<text x="44" y="283" font-size="20">다른 짐·날은 별도 확인</text>
<rect x="329" y="167" width="227" height="43" rx="12" fill="#f0eef4"/>
<text x="342" y="195" font-size="21" font-weight="700">수납칸 5개만 확인</text>
<text x="329" y="247" font-size="20">열쇠 접근: 미확인</text>
<text x="329" y="283" font-size="20">노트북 수납: 미확인</text>
<text x="32" y="375" font-size="21" font-weight="700">칸 수 ≠ 내가 원하는 사용 결과</text>
</g></svg>
