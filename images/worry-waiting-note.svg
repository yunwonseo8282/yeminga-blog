<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">기다리는 일 메모하기</title><desc id="desc">이미 한 일, 기다리는 정보, 지금 가능한 행동, 다시 볼 조건과 근거, 조건이 오면 할 일을 나누는 예밍이네의 일상 정리용 양식입니다.</desc>
<rect width="1200" height="1200" rx="48" fill="#edf1fb"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#30384d">
<text x="78" y="113" font-size="60" font-weight="700">확인 요청은 보냈는데</text><text x="78" y="191" font-size="60" font-weight="700">아직 답이 없다면</text>
<text x="78" y="259" font-size="30" fill="#556685">끝낸 행동과 기다리는 정보를 따로 적어요</text>
<g fill="#fff"><rect x="66" y="310" width="1068" height="130" rx="24"/><rect x="66" y="465" width="1068" height="130" rx="24"/><rect x="66" y="620" width="1068" height="130" rx="24"/><rect x="66" y="775" width="1068" height="130" rx="24"/><rect x="66" y="930" width="1068" height="130" rx="24"/></g>
<text x="101" y="365" font-size="37" font-weight="700">1  이미 한 일</text><text x="101" y="414" font-size="28">무엇을 했고, 어떤 기록이 있나요?</text>
<text x="101" y="520" font-size="37" font-weight="700">2  기다리는 정보</text><text x="101" y="569" font-size="28">아직 답이 오지 않은 부분은 무엇인가요?</text>
<text x="101" y="675" font-size="37" font-weight="700">3  지금 가능한 행동</text><text x="101" y="724" font-size="28">실제로 필요한 일이 없다면 ‘현재 없음’</text>
<text x="101" y="830" font-size="37" font-weight="700">4  다시 볼 조건과 근거</text><text x="101" y="879" font-size="28">새 정보 · 공지 · 합의 · 내 일정상 필요</text>
<text x="101" y="985" font-size="37" font-weight="700">5  조건이 오면 할 일</text><text x="101" y="1034" font-size="28">답이 올 때 / 안내 시점이 지났을 때</text>
<text x="78" y="1132" font-size="27" fill="#556685">예밍이네가 구성한 메모 · 효과가 검증된 검사는 아니에요</text>
</g></svg>
