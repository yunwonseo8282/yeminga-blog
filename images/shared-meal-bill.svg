<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">식사비 총액과 나눌 기준을 구분하기</title><desc id="desc">직접 구성한 가상 계산. 음식 할인 후 식사비 총액 60000원. 전체 균등이면 각20000원, 음식만 균등에 음료 각자이면 A22000 B20000 C18000원. 이미 낸 돈을 반영해 추가 정산해요.</desc><rect width="1200" height="1200" fill="#f2f6fa"/><g font-family="Malgun Gothic, sans-serif" fill="#20374b"><text x="76" y="116" font-size="35" fill="#48667a">예밍이네 가상 식사비 비교</text><text x="76" y="205" font-size="60" font-weight="700">같은 영수증, 다른 분담</text><rect x="66" y="268" width="1068" height="190" rx="28" fill="#dceaf3"/><text x="103" y="337" font-size="35">음식 54,000 + 음료 12,000 − 쿠폰 6,000</text><text x="103" y="414" font-size="53" font-weight="700">실제 식당 결제액 60,000원</text><rect x="66" y="498" width="1068" height="198" rx="28" fill="white"/><text x="103" y="567" font-size="38" font-weight="700">전체를 균등하게 나누기로 했다면</text><text x="103" y="640" font-size="43">A 20,000 · B 20,000 · C 20,000원</text><rect x="66" y="735" width="1068" height="198" rx="28" fill="white"/><text x="103" y="804" font-size="38" font-weight="700">음식만 균등 + 음료는 각자라면</text><text x="103" y="877" font-size="43">A 22,000 · B 20,000 · C 18,000원</text><text x="76" y="1013" font-size="32">정한 분담액과 이미 낸 돈은 따로 확인해요.</text><text x="76" y="1080" font-size="29" fill="#48667a">음식은 셋이 균등 분담하기로 한 가상 조건</text><text x="76" y="1129" font-size="28" fill="#48667a">유일하게 공정한 방식이나 법적 기준이 아니에요.</text></g></svg>
