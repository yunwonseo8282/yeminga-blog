<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">같은 산책 사진을 보는 사람</title>
  <desc id="desc">가상 사례. 친구 방에서는 산책한 세 명이 사진을 보고, 동호회 방에서는 같은 세 명에 일곱 명이 더해진다. 다른 방에 보내기 전에 사진에 나온 친구의 뜻을 확인한다.</desc>
  <rect width="1200" height="1200" rx="54" fill="#efeafa"/>
  <g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#29253e">
    <text x="75" y="135" font-weight="700" font-size="73">사진은 한 장</text>
    <text x="75" y="232" font-weight="700" font-size="73">누가 보게 될까요?</text>
    <rect x="75" y="316" width="1050" height="267" rx="35" fill="#fff"/>
    <text x="116" y="405" font-size="55" font-weight="700">친구 방</text>
    <text x="116" y="487" font-size="49">산책에 간 3명</text>
    <g fill="#7362ab">
      <circle cx="840" cy="454" r="24"/><circle cx="914" cy="454" r="24"/><circle cx="988" cy="454" r="24"/>
    </g>
    <rect x="75" y="618" width="1050" height="352" rx="35" fill="#fff"/>
    <text x="116" y="707" font-size="55" font-weight="700">동호회 방</text>
    <text x="116" y="790" font-size="49">같은 3명과 다른 7명</text>
    <g fill="#7362ab">
      <circle cx="153" cy="890" r="24"/><circle cx="252" cy="890" r="24"/><circle cx="351" cy="890" r="24"/>
    </g>
    <g fill="#c5b8e7">
      <circle cx="450" cy="890" r="24"/><circle cx="549" cy="890" r="24"/><circle cx="648" cy="890" r="24"/>
      <circle cx="747" cy="890" r="24"/><circle cx="846" cy="890" r="24"/><circle cx="945" cy="890" r="24"/><circle cx="1044" cy="890" r="24"/>
    </g>
    <text x="75" y="1083" font-weight="700" font-size="47">방을 바꾸기 전에 먼저 물어요</text>
    <text x="75" y="1145" font-size="33" fill="#504468">가상 예시</text>
  </g>
</svg>
