<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">같은 물건, 배송 조건에 따라 달라지는 결제액</title><desc id="desc">직접 구성한 가상 사례. A와 B에서 따로 주문하면 상품값 26,000원과 배송비 5,500원으로 31,500원. A 묶음 가능이면 상품값 28,000원과 배송비 3,000원으로 31,000원. A 묶음 불가이면 상품값 28,000원과 배송비 5,500원으로 33,500원. 실제 상품 가격이나 절약 효과를 조사한 결과가 아닙니다.</desc>
<rect width="1200" height="1200" rx="48" fill="#f0e9fb"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#302d3b">
<text x="72" y="112" font-size="58" font-weight="700">같은 물건을 살 때</text><text x="72" y="188" font-size="58" font-weight="700">배송비까지 함께 봐요</text>
<text x="72" y="251" font-size="36" fill="#665b76">세제 1개·수세미 1묶음 / 직접 구성한 가상 조건</text>
<rect x="62" y="301" width="1076" height="222" rx="26" fill="#fff"/>
<text x="98" y="378" font-size="52" font-weight="700">A·B 따로 주문</text><text x="1100" y="459" text-anchor="end" font-size="66" font-weight="700">31,500원</text>
<text x="98" y="494" font-size="34" fill="#665b76">상품 26,000 + 배송 5,500</text>
<rect x="62" y="549" width="1076" height="222" rx="26" fill="#e7defa" stroke="#9978cd" stroke-width="3"/>
<text x="98" y="626" font-size="52" font-weight="700">A에서 묶음 가능</text><text x="1100" y="707" text-anchor="end" font-size="66" font-weight="700">31,000원</text>
<text x="98" y="742" font-size="34" fill="#665b76">상품 28,000 + 배송 3,000</text>
<rect x="62" y="797" width="1076" height="222" rx="26" fill="#fff"/>
<text x="98" y="874" font-size="52" font-weight="700">A에서도 묶음 불가</text><text x="1100" y="955" text-anchor="end" font-size="66" font-weight="700">33,500원</text>
<text x="98" y="990" font-size="34" fill="#665b76">상품 28,000 + 배송 5,500</text>
<text x="72" y="1094" font-size="40" font-weight="700">판매처 이름보다 배송비 계산 조건을 확인해요.</text>
<text x="72" y="1150" font-size="29" fill="#665b76">특정 판매처의 실제 가격이나 보장된 절약 효과가 아니에요.</text>
</g></svg>
