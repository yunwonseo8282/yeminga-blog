<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
<title id="title">거절 뒤 설명을 정리하는 세 가지</title><desc id="desc">필요한 사실, 내가 고를 설명, 반복해서 전할 결정을 나누는 일상 대화 정리용 그림. 연구 결과나 심리검사가 아닙니다.</desc>
<rect width="1200" height="1200" rx="48" fill="#f0e9fb"/>
<g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#302d3b">
<text x="84" y="130" font-size="60" font-weight="700">거절한 뒤에도</text><text x="84" y="208" font-size="60" font-weight="700">이유를 더 묻는다면</text>
<text x="84" y="278" font-size="30" fill="#665b76">설명을 늘리기 전에 나눠 볼 세 가지</text>
<rect x="72" y="338" width="1056" height="190" rx="28" fill="#fff"/><text x="108" y="408" font-size="45" font-weight="700">필요한 사실</text><text x="108" y="474" font-size="32">가능한 범위 · 일정 · 이미 한 약속</text>
<rect x="72" y="564" width="1056" height="190" rx="28" fill="#fff"/><text x="108" y="634" font-size="45" font-weight="700">내가 고를 설명</text><text x="108" y="700" font-size="32">사생활을 어디까지 나눌지 선택</text>
<rect x="72" y="790" width="1056" height="190" rx="28" fill="#fff"/><text x="108" y="860" font-size="45" font-weight="700">반복해서 전할 결정</text><text x="108" y="926" font-size="32">조건이 같다면 결정도 분명하게</text>
<text x="84" y="1060" font-size="28" fill="#665b76">예밍이네가 구성한 일상 대화 정리용 구분</text><text x="84" y="1110" font-size="25" fill="#665b76">심리검사나 관계 개선 효과가 검증된 절차는 아니에요.</text>
</g></svg>
