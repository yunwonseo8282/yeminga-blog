<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">피드백의 말과 가리킨 부분을 나눠 읽기</title><desc id="desc">직접 구성한 가상 발표 수정. 짧게는 반복 도입을 줄이라는 요청, 자세히는 처음 참가하는 절차를 보강하라는 요청으로 확인한 경우예요. 같은 부분의 요청이 충돌하면 조건을 다시 물어요.</desc><rect width="1200" height="1200" fill="#f5f0fa"/><g font-family="Malgun Gothic, sans-serif" fill="#453158"><text x="76" y="119" font-size="34" fill="#756184">예밍이네 가상 발표 수정</text><text x="76" y="209" font-size="59" font-weight="700">말이 다른 피드백을 받았다면</text><text x="76" y="280" font-size="34">목적·청중·가리킨 부분부터 확인해요</text><rect x="66" y="334" width="1068" height="217" rx="28" fill="white"/><text x="104" y="408" font-size="44" font-weight="700">“짧게 해 주세요”</text><text x="104" y="479" font-size="35">어느 부분일까? → 반복된 도입 줄이기</text><rect x="66" y="592" width="1068" height="217" rx="28" fill="white"/><text x="104" y="666" font-size="44" font-weight="700">“자세히 설명해 주세요”</text><text x="104" y="737" font-size="35">무엇이 빠졌나? → 첫 참가 절차 보강</text><text x="76" y="903" font-size="34">이 가상 사례는 서로 다른 부분을 고친 경우예요.</text><text x="76" y="973" font-size="32">같은 부분의 요청이 충돌하면 조건을 다시 물어요.</text><text x="76" y="1062" font-size="28" fill="#756184">직접 구성한 정리 예시 · 공식 평가 도구가 아니에요.</text><text x="76" y="1112" font-size="28" fill="#756184">발표 성과나 피드백 수용을 보장하지 않아요.</text></g></svg>
