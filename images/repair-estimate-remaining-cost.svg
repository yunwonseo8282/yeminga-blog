<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400" role="img" aria-labelledby="title desc">
  <title id="title">가상 수리 견적: 이미 낸 진단비와 앞으로 낼 금액</title>
  <desc id="desc">직접 만든 가상 예시입니다. 이미 낸 진단비 2만 원은 환불되지 않는다고 가정합니다. 수리 A는 진단비를 포함한 총액이 8만 원이므로 남은 결제액은 6만 원입니다. 수리 B는 진단비와 별도로 8만 원을 추가 청구하므로 남은 결제액은 8만 원입니다. A와 B는 동시에 적용하지 않는 서로 다른 견적 조건입니다. 교체 결제액은 7만 5천 원입니다. 금액만으로 선택의 우열을 정하지 않습니다.</desc>
  <rect width="600" height="400" rx="24" fill="#f7f2fa" />
  <g font-family="'Noto Sans KR', 'Malgun Gothic', sans-serif" fill="#30263f">
    <text x="30" y="43" font-size="25" font-weight="700">앞으로 낼 금액만 나란히 보기</text>
    <text x="30" y="79" font-size="19">가상 예시 · 이미 낸 진단비 2만 원은 환불 불가</text>
    <rect x="26" y="101" width="548" height="54" rx="12" fill="#e8def7" />
    <rect x="26" y="168" width="548" height="54" rx="12" fill="#e8def7" />
    <rect x="26" y="235" width="548" height="54" rx="12" fill="#e8def7" />
    <text x="42" y="138" font-size="30" font-weight="700">수리 A · 총액 8만 → 남은 6만</text>
    <text x="42" y="205" font-size="30" font-weight="700">수리 B · 추가 8만 → 남은 8만</text>
    <text x="42" y="272" font-size="30" font-weight="700">교체 · 결제액 7.5만 → 남은 7.5만</text>
    <text x="30" y="323" font-size="17" fill="#655a74">직접 만든 가상 예시 · A/B는 함께 적용하지 않는 조건</text>
    <text x="30" y="353" font-size="17" fill="#655a74">단위: 원 · 기능과 실제 견적 조건은 별도로 확인해요.</text>
  </g>
</svg>
