<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc"><title id="title">고민을 들을 때 원하는 도움 확인하기</title><desc id="desc">우선 듣기, 생각 정리, 선택지 함께 찾기. 원하는 도움이 달라지면 다시 묻고 내가 가능한 범위도 나누는 일상 대화용 구분입니다.</desc><rect width="1200" height="1200" rx="48" fill="#eef4ef"/><g font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" fill="#314737"><text x="80" y="125" font-size="58" font-weight="700">고민을 들었을 때</text><text x="80" y="204" font-size="58" font-weight="700">지금 어떤 도움이 필요할까?</text><text x="80" y="275" font-size="30" fill="#5b7060">답부터 내기 전에 원하는 역할을 확인해요</text><g fill="#fff"><rect x="66" y="335" width="1068" height="180" rx="26"/><rect x="66" y="550" width="1068" height="180" rx="26"/><rect x="66" y="765" width="1068" height="180" rx="26"/></g><text x="105" y="404" font-size="43" font-weight="700">우선 듣기</text><text x="105" y="467" font-size="31">상대의 이야기와 내가 이해한 내용 확인</text><text x="105" y="619" font-size="43" font-weight="700">생각 정리</text><text x="105" y="682" font-size="31">복잡한 말을 함께 나누고 빠진 부분 확인</text><text x="105" y="834" font-size="43" font-weight="700">선택지 함께 찾기</text><text x="105" y="897" font-size="31">원하는 범위에서 방법을 놓고 함께 살피기</text><text x="80" y="1027" font-size="30" fill="#5b7060">필요가 바뀌면 다시 묻고, 가능한 범위도 말해요</text><text x="80" y="1090" font-size="27" fill="#5b7060">예밍이네가 구성한 가상 대화용 구분</text><text x="80" y="1137" font-size="25" fill="#5b7060">공식 검사나 효과가 검증된 순서가 아니에요.</text></g></svg>
